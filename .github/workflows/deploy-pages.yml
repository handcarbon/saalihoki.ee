name: Deploy production site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build -- --configuration production --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Add SPA route fallback
        run: |
          cp dist/saalihoki-ee/browser/index.html dist/saalihoki-ee/browser/404.html
          touch dist/saalihoki-ee/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/saalihoki-ee/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy Pages publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          legacy_run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20" \
              --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .name == \"pages build and deployment\") | .id" \
              | head -n 1
          )"

          if [ -z "$legacy_run_id" ]; then
            echo "No legacy Pages run found; continuing with workflow deployment."
            exit 0
          fi

          for attempt in $(seq 1 30); do
            legacy_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${legacy_run_id}" --jq '.status')"
            if [ "$legacy_status" = "completed" ]; then
              echo "Legacy Pages run completed; publishing the production artifact."
              exit 0
            fi
            echo "Legacy Pages run is ${legacy_status}; waiting (${attempt}/30)."
            sleep 5
          done

          echo "::error::Timed out waiting for the legacy Pages run."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
